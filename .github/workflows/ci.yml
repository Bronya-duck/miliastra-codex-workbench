name: Test source and release boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --prefix runtime
      - run: npm test
      - run: npm run test:knowledge
      - run: npm run check-release
